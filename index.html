<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频号备用下载</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#20252a;font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:0}header{background:white;border-bottom:1px solid #dce2e6;padding:22px max(24px,calc((100% - 840px)/2))}h1{font-size:24px;margin:0;white-space:nowrap}.tag{font-size:13px;color:#087758;margin-top:8px}main{max-width:840px;margin:36px auto;padding:0 24px}label{display:block;font-weight:600;margin-bottom:12px}textarea{width:100%;height:170px;resize:vertical;padding:16px;border:1px solid #b9c5cc;border-radius:6px;font:16px inherit;background:white}textarea:focus{outline:2px solid #087758;outline-offset:2px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{font:600 16px -apple-system,sans-serif;border:1px solid #bcc8cd;border-radius:6px;padding:12px 22px;background:white;cursor:pointer;min-height:48px}button.primary{background:#087758;border-color:#087758;color:white}button:disabled{opacity:.55;cursor:wait}progress{width:100%;height:8px;accent-color:#087758}#status{padding:20px 0;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap;min-height:100px}#status.error{color:#b12b38}#status.success{color:#087758}footer{border-top:1px solid #dce2e6;padding-top:20px;color:#596772;font-size:13px;line-height:1.7}@media(max-width:480px){h1{font-size:22px}main{margin-top:24px}.actions button{flex:1;padding:12px}}
</style></head><body><header><h1>视频号备用下载</h1><div class="tag">本机服务 · 腾讯直连</div></header><main>
<form id="form"><label for="url">视频号分享链接</label><textarea id="url" name="url" placeholder="https://weixin.qq.com/sph/…" required></textarea><div class="actions"><button class="primary" id="download" type="submit">下载视频</button><button id="folder" type="button">打开下载目录</button></div></form>
<progress id="progress" hidden></progress><div id="status" role="status" aria-live="polite">等待下载</div><footer>解析请求直接发送给腾讯元宝和视频号。请勿输入密码或私人消息。元宝登录态失效后需更新。</footer></main>
<script>
const token="__TOKEN__",status=document.querySelector('#status'),progress=document.querySelector('#progress'),button=document.querySelector('#download');
async function call(path,body={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();button.disabled=true;progress.hidden=false;status.className='';status.textContent='正在解析并下载…';try{const d=await call('/web/download',{url:document.querySelector('#url').value.trim()});status.className='success';status.textContent='下载完成\n'+d.path+'\n大小：'+(d.bytes/1048576).toFixed(2)+' MB'}catch(e){status.className='error';status.textContent=e.message}finally{button.disabled=false;progress.hidden=true}};
document.querySelector('#folder').onclick=async()=>{try{await call('/web/open-folder')}catch(e){status.className='error';status.textContent=e.message}};
</script></body></html>
